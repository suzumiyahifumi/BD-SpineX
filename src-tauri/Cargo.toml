[package]
name = "bd-spinex-tauri"
version = "2.27.19"
description = "BrownDust II runtime mod manager for Mac PlayCover."
authors = ["BD-SpineX contributors"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "bd_spinex_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
walkdir = "2"
