<title>BD-SpineX - Mod Manager</title>
<style>
  html,
  body {
    margin: 0;
    min-height: 100%;
    background: #0e0d0c;
    color: #ede0c4;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, ui-sans-serif, system-ui, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
  }

  .bootShell {
    position: relative;
    display: grid;
    min-height: 100vh;
    overflow: hidden;
    place-items: center;
    background:
      radial-gradient(520px 360px at 8% -10%, rgba(36, 26, 16, 0.72), transparent 62%),
      radial-gradient(420px 320px at calc(100% - 76px) 48px, rgba(42, 18, 11, 0.58), transparent 58%),
      radial-gradient(rgba(226, 64, 42, 0.07) 1px, transparent 1.5px),
      radial-gradient(rgba(232, 162, 44, 0.07) 1px, transparent 1.5px),
      linear-gradient(rgba(237, 224, 196, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(237, 224, 196, 0.045) 1px, transparent 1px),
      #0e0d0c;
    background-position:
      center,
      center,
      0 0,
      8px 8px,
      0 0,
      0 0,
      center;
    background-size:
      auto,
      auto,
      16px 16px,
      16px 16px,
      40px 40px,
      40px 40px,
      auto;
  }

  .bootShell::before {
    content: "BDII";
    position: fixed;
    top: 0;
    right: 0;
    z-index: 0;
    display: flex;
    width: min(420px, 34vw);
    height: min(300px, 34vh);
    align-items: flex-start;
    justify-content: flex-end;
    padding: 10px 30px 0 0;
    pointer-events: none;
    background: radial-gradient(360px 280px at calc(100% - 86px) 48px, rgba(42, 18, 11, 0.58), transparent 58%);
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: rgba(237, 224, 196, 0.036);
    font-family: "Arial Narrow", "Helvetica Neue Condensed", Impact, sans-serif;
    font-size: clamp(128px, 15vw, 220px);
    font-weight: 800;
    line-height: 0.82;
    mix-blend-mode: screen;
    text-transform: uppercase;
  }

  .bootShell::after {
    content: "";
    position: fixed;
    top: 22px;
    right: 24px;
    z-index: 0;
    width: 36px;
    height: 36px;
    pointer-events: none;
    opacity: 0.56;
    background:
      radial-gradient(circle at 18px 18px, transparent 0 7px, rgba(237, 224, 196, 0.34) 7px 8.5px, transparent 9px),
      linear-gradient(rgba(237, 224, 196, 0.34), rgba(237, 224, 196, 0.34)) 17.25px 6px / 1.5px 24px no-repeat,
      linear-gradient(90deg, rgba(237, 224, 196, 0.34), rgba(237, 224, 196, 0.34)) 6px 17.25px / 24px 1.5px no-repeat;
  }

  .bootPanel {
    position: relative;
    z-index: 1;
    display: grid;
    gap: 8px;
    justify-items: center;
    text-align: center;
  }

  .bootIcon {
    width: 76px;
    height: 76px;
    border-radius: 18px;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
  }

  .bootTitle {
    font-size: 22px;
    font-weight: 700;
  }

  .bootText {
    color: #a99e84;
    font-size: 13px;
  }
</style>
