<title>BD-SpineX - Mod Manager</title>

  .bootShell {

  .bootTitle {
    font-size: 22px;
    font-weight: 700;
  }

  .bootText {
    color: #5e6b7d;
    font-size: 13px;
  }

<div id="root">
  <div class="bootShell">
    <div class="bootPanel">
      <img class="bootIcon" src="./icon.png" alt="" />

      <div class="bootText">Starting mod manager...</div>
    </div>
  </div>
