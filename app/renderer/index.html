<title>BD-SpineX - Mod Manager</title>
<style>
  html,
  body {
    margin: 0;
    min-height: 100%;
    background: #06070d;
    color: #eef1fb;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, ui-sans-serif, system-ui, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
  }

  .bootShell {
    display: grid;
    min-height: 100vh;
    place-items: center;
    background:
      radial-gradient(900px 600px at 15% -10%, #1a1640 0%, transparent 60%),
      radial-gradient(800px 560px at 100% 0%, #07212b 0%, transparent 55%),
      #06070d;
  }

  .bootPanel {
    display: grid;
    gap: 8px;
    justify-items: center;
    text-align: center;
  }

  .bootIcon {
    width: 76px;
    height: 76px;
    border-radius: 18px;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
  }

  .bootTitle {
    font-size: 22px;
    font-weight: 700;
  }

  .bootText {
    color: #9aa3bd;
    font-size: 13px;
  }
</style>
